# ============================================================
#  Despliegue automatico en Render (https://render.com)
#  Render lee este archivo y crea el servidor solo.
#  La API Key NO va aca: se carga aparte, en el panel de Render
#  (Environment), para que quede secreta.
# ============================================================
services:
  - type: web
    name: aira-backend
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Estas dos las completas vos en el panel de Render (NO aca):
      #   GEMINI_API_KEY   -> AQ.Ab8RN6IGMUHWrELuFgmC3IhF9Xxjpe_BkUPG9BNTfFxpQifX1A
      #   ALLOWED_ORIGINS  -> https://lucrb2231.github.io/veltrix/
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
