# ============================================================
#  Despliegue automatico en Render (https://render.com)
#  Render lee este archivo y crea el servidor solo.
#  La API Key NO va aca: se carga aparte, en el panel de Render
#  (Environment), para que quede secreta.
# ============================================================
services:
  - type: web
    name: aira-backend
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      # Proveedor por defecto = IA 1: gemini | openai | openrouter
      # Conviene que coincida con AIRA_PROVIDER del index.html.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.6-flash
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      # Sensor de tokens: presupuesto estimado por proveedor y orden de respaldo.
      - key: AI_TOKENS_GEMINI
        value: "1000000"
      - key: AI_TOKENS_OPENAI
        value: "2000000"
      - key: AI_TOKENS_OPENROUTER
        value: "500000"
      - key: AI_TOKEN_RESERVE
        value: "800"
      - key: AI_TOKEN_WINDOW_HOURS
        value: "24"
      - key: AI_QUOTA_COOLDOWN_MIN
        value: "60"
      - key: AI_FALLBACK_ORDER
        value: gemini,openrouter,openai
      # IA facial en el servidor (umbrales minimos; el navegador solo puede ser mas estricto)
      - key: FACE_MIN_SIM
        value: "0.55"
      - key: FACE_MIN_GAP
        value: "0.04"
      - key: FACE_LIVENESS
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Estas dos las completas vos en el panel de Render (NO aca):
      #   GEMINI_API_KEY   -> tu clave secreta
      #   ALLOWED_ORIGINS  -> la direccion de tu pagina de GitHub
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
